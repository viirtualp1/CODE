<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f1" />
    <meta name="color-scheme" content="light dark" />
    <style>html { background: #f6f5f1; } html[data-theme="dark"] { background: #191b1a; }</style>
    <script>
      (() => {
        let theme = 'system';
        try { const stored = localStorage.getItem('code-appearance'); if (['system', 'dark', 'light'].includes(stored)) theme = stored; } catch {}
        const dark = theme === 'dark' || theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#191b1a' : '#f6f5f1';
      })();
    </script>
    <meta name="description" content="Find a little clarity in CODE, a beautifully quiet offline cryptogram game." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>CODE</title>
  </head>
  <body><div id="app"></div><script type="module" src="/src/main.ts"></script></body>
</html>

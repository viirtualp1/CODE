name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm test
      - run: npm run build
      - name: Prepare web archive and notes
        run: |
          node scripts/release.mjs notes > release-notes.md
          cd dist
          zip -qr "../CODE-${RELEASE_TAG}-web.zip" .
          cd ..
          sha256sum "CODE-${RELEASE_TAG}-web.zip" > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" "CODE-${RELEASE_TAG}-web.zip" SHA256SUMS.txt \
            --verify-tag --title "CODE ${RELEASE_TAG}" --notes-file release-notes.md
